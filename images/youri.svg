<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-label="Agentic RAG router splitting a clinical query into internal, external and hybrid retrieval paths">
  <defs>
    <linearGradient id="yBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#062730"/>
      <stop offset="1" stop-color="#07131d"/>
    </linearGradient>
    <linearGradient id="yLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".2"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity=".9"/>
    </linearGradient>
    <pattern id="yGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#22d3ee" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="360" fill="url(#yBg)"/>
  <rect width="800" height="360" fill="url(#yGrid)"/>

  <!-- query bubble -->
  <g>
    <rect x="48" y="140" width="132" height="66" rx="14" fill="#0e7490" fill-opacity=".28" stroke="#22d3ee" stroke-opacity=".65" stroke-width="2"/>
    <path d="M84 206l-6 22 26-22z" fill="#0e7490" fill-opacity=".28"/>
    <rect x="68" y="160" width="92" height="7" rx="3.5" fill="#67e8f9" fill-opacity=".8"/>
    <rect x="68" y="177" width="62" height="7" rx="3.5" fill="#67e8f9" fill-opacity=".45"/>
  </g>

  <!-- router -->
  <g>
    <path d="M330 118l58 55-58 55-58-55z" fill="#0a1f28" stroke="#22d3ee" stroke-width="2.5"/>
    <circle cx="330" cy="173" r="15" fill="none" stroke="#5eead4" stroke-width="2.5"/>
    <path d="M323 173l5 6 10-12" fill="none" stroke="#5eead4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- edges -->
  <g fill="none" stroke="url(#yLine)" stroke-width="2.5" stroke-linecap="round">
    <path d="M180 173h84"/>
    <path d="M392 173h48c14 0 22-10 22-24V86c0-14 8-24 22-24h42"/>
    <path d="M392 173h130"/>
    <path d="M392 173h48c14 0 22 10 22 24v63c0 14 8 24 22 24h42"/>
  </g>

  <!-- destination nodes -->
  <g>
    <rect x="530" y="34" width="222" height="56" rx="12" fill="#0a1f28" stroke="#22d3ee" stroke-opacity=".55" stroke-width="2"/>
    <ellipse cx="566" cy="53" rx="14" ry="5" fill="none" stroke="#5eead4" stroke-width="2"/>
    <path d="M552 53v16c0 2.8 6.3 5 14 5s14-2.2 14-5V53" fill="none" stroke="#5eead4" stroke-width="2"/>
    <rect x="596" y="49" width="122" height="7" rx="3.5" fill="#67e8f9" fill-opacity=".75"/>
    <rect x="596" y="65" width="78" height="6" rx="3" fill="#67e8f9" fill-opacity=".35"/>
  </g>

  <g>
    <rect x="530" y="145" width="222" height="56" rx="12" fill="#0a1f28" stroke="#22d3ee" stroke-opacity=".55" stroke-width="2"/>
    <circle cx="566" cy="173" r="13" fill="none" stroke="#5eead4" stroke-width="2"/>
    <path d="M553 173h26M566 160c6 7 6 19 0 26-6-7-6-19 0-26z" fill="none" stroke="#5eead4" stroke-width="2"/>
    <rect x="596" y="160" width="122" height="7" rx="3.5" fill="#67e8f9" fill-opacity=".75"/>
    <rect x="596" y="176" width="92" height="6" rx="3" fill="#67e8f9" fill-opacity=".35"/>
  </g>

  <g>
    <rect x="530" y="256" width="222" height="56" rx="12" fill="#0a1f28" stroke="#22d3ee" stroke-opacity=".55" stroke-width="2"/>
    <path d="M556 274a10 10 0 0 1 20 0 10 10 0 0 1-20 0z" fill="none" stroke="#5eead4" stroke-width="2"/>
    <path d="M560 292a10 10 0 0 1 20 0" fill="none" stroke="#5eead4" stroke-width="2"/>
    <rect x="596" y="271" width="122" height="7" rx="3.5" fill="#67e8f9" fill-opacity=".75"/>
    <rect x="596" y="287" width="64" height="6" rx="3" fill="#67e8f9" fill-opacity=".35"/>
  </g>

  <!-- shield: PII redaction before external inference -->
  <g transform="translate(452 52)">
    <path d="M18 0l17 7v13c0 11-7 20-17 24C8 40 1 31 1 20V7z" fill="#07131d" stroke="#5eead4" stroke-width="2"/>
    <path d="M11 20l5 6 11-13" fill="none" stroke="#5eead4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
