<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-label="Streaming 5G network metrics with two anomaly spikes flagged on a live time series">
  <defs>
    <linearGradient id="nBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#062730"/>
      <stop offset="1" stop-color="#07131d"/>
    </linearGradient>
    <linearGradient id="nFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".38"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <pattern id="nGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#22d3ee" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="360" fill="url(#nBg)"/>
  <rect width="800" height="360" fill="url(#nGrid)"/>

  <!-- tower + signal arcs -->
  <g transform="translate(96 96)">
    <path d="M0 132L20 0M40 132L20 0M6 92h28" fill="none" stroke="#22d3ee" stroke-opacity=".8" stroke-width="3" stroke-linecap="round"/>
    <g fill="none" stroke="#5eead4" stroke-linecap="round" stroke-width="3">
      <path d="M40 24a30 30 0 0 1 0 34" stroke-opacity=".85"/>
      <path d="M54 12a50 50 0 0 1 0 58" stroke-opacity=".55"/>
      <path d="M68 0a70 70 0 0 1 0 82" stroke-opacity=".28"/>
      <path d="M0 24a30 30 0 0 0 0 34" stroke-opacity=".85"/>
      <path d="M-14 12a50 50 0 0 0 0 58" stroke-opacity=".55"/>
      <path d="M-28 0a70 70 0 0 0 0 82" stroke-opacity=".28"/>
    </g>
  </g>

  <!-- axes -->
  <g stroke="#22d3ee" stroke-opacity=".22" stroke-width="1.5">
    <path d="M250 300h500"/>
    <path d="M250 60v240"/>
  </g>
  <g stroke="#22d3ee" stroke-opacity=".12" stroke-width="1" stroke-dasharray="4 6">
    <path d="M250 240h500M250 180h500M250 120h500"/>
  </g>

  <!-- throughput series -->
  <path d="M250 236l34-12 34 9 34-14 34 8 34-96 34 92 34-6 34 12 34-10 34 7 34-74 34 70 34 8"
        fill="none" stroke="#22d3ee" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M250 236l34-12 34 9 34-14 34 8 34-96 34 92 34-6 34 12 34-10 34 7 34-74 34 70 34 8V300H250z"
        fill="url(#nFill)"/>

  <!-- anomaly markers -->
  <g>
    <circle cx="420" cy="131" r="11" fill="#07131d" stroke="#f87171" stroke-width="3"/>
    <circle cx="420" cy="131" r="21" fill="none" stroke="#f87171" stroke-opacity=".35" stroke-width="2"/>
    <path d="M420 122v11M420 139v1.5" stroke="#f87171" stroke-width="2.5" stroke-linecap="round"/>

    <circle cx="658" cy="153" r="11" fill="#07131d" stroke="#f87171" stroke-width="3"/>
    <circle cx="658" cy="153" r="21" fill="none" stroke="#f87171" stroke-opacity=".35" stroke-width="2"/>
    <path d="M658 144v11M658 161v1.5" stroke="#f87171" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- kafka stream pips -->
  <g transform="translate(250 328)">
    <path d="M0 0h500" stroke="#22d3ee" stroke-opacity=".2" stroke-width="2"/>
    <g fill="#5eead4">
      <circle cx="30" cy="0" r="4"/><circle cx="96" cy="0" r="4" fill-opacity=".8"/>
      <circle cx="162" cy="0" r="4" fill-opacity=".6"/><circle cx="228" cy="0" r="4" fill-opacity=".8"/>
      <circle cx="294" cy="0" r="4"/><circle cx="360" cy="0" r="4" fill-opacity=".6"/>
      <circle cx="426" cy="0" r="4" fill-opacity=".85"/><circle cx="480" cy="0" r="4"/>
    </g>
  </g>

  <!-- status chip -->
  <g transform="translate(250 24)">
    <rect width="196" height="30" rx="15" fill="#0a1f28" stroke="#22d3ee" stroke-opacity=".5" stroke-width="1.6"/>
    <circle cx="20" cy="15" r="5" fill="#5eead4"/>
    <text x="36" y="20" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12" fill="#8fdfea" letter-spacing="1.2">STREAMING · 2 ALERTS</text>
  </g>
</svg>
