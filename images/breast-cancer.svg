<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-label="Convolutional network layers processing a medical scan patch with a detected region boxed">
  <defs>
    <linearGradient id="bBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#062730"/>
      <stop offset="1" stop-color="#07131d"/>
    </linearGradient>
    <radialGradient id="bLesion" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#d7fff6" stop-opacity=".95"/>
      <stop offset=".5" stop-color="#5eead4" stop-opacity=".55"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="bGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#22d3ee" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="360" fill="url(#bBg)"/>
  <rect width="800" height="360" fill="url(#bGrid)"/>

  <!-- input scan -->
  <g transform="translate(48 76)">
    <rect width="208" height="208" rx="10" fill="#0a1f28" stroke="#22d3ee" stroke-opacity=".7" stroke-width="2.5"/>
    <g stroke="#22d3ee" stroke-opacity=".14" stroke-width="1">
      <path d="M52 0v208M104 0v208M156 0v208M0 52h208M0 104h208M0 156h208"/>
    </g>
    <!-- tissue texture -->
    <g fill="none" stroke="#22d3ee" stroke-opacity=".3" stroke-width="2" stroke-linecap="round">
      <path d="M20 168c30-22 44-58 34-96"/>
      <path d="M52 188c40-26 58-74 46-124"/>
      <path d="M92 196c44-30 62-86 48-140"/>
      <path d="M136 200c34-34 46-90 32-134"/>
    </g>
    <!-- lesion + detection box -->
    <ellipse cx="140" cy="78" rx="34" ry="30" fill="url(#bLesion)"/>
    <rect x="104" y="44" width="72" height="68" rx="4" fill="none" stroke="#5eead4" stroke-width="3"/>
    <rect x="104" y="18" width="72" height="20" rx="4" fill="#5eead4"/>
    <text x="112" y="33" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12" font-weight="700" fill="#06262f">ROI</text>
  </g>

  <!-- arrow -->
  <path d="M276 180h44" fill="none" stroke="#22d3ee" stroke-opacity=".6" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M312 172l10 8-10 8" fill="none" stroke="#22d3ee" stroke-opacity=".6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- conv feature maps -->
  <g>
    <g transform="translate(340 96)">
      <rect x="16" y="16" width="90" height="150" rx="6" fill="#0a1f28" stroke="#22d3ee" stroke-opacity=".3" stroke-width="1.8"/>
      <rect x="8" y="8" width="90" height="150" rx="6" fill="#0a1f28" stroke="#22d3ee" stroke-opacity=".45" stroke-width="1.8"/>
      <rect x="0" y="0" width="90" height="150" rx="6" fill="#0b2630" stroke="#22d3ee" stroke-opacity=".75" stroke-width="2"/>
      <g fill="#22d3ee">
        <rect x="14" y="18" width="62" height="9" rx="4" fill-opacity=".65"/>
        <rect x="14" y="38" width="44" height="9" rx="4" fill-opacity=".4"/>
        <rect x="14" y="58" width="56" height="9" rx="4" fill-opacity=".55"/>
        <rect x="14" y="78" width="34" height="9" rx="4" fill-opacity=".3"/>
        <rect x="14" y="98" width="50" height="9" rx="4" fill-opacity=".5"/>
        <rect x="14" y="118" width="40" height="9" rx="4" fill-opacity=".35"/>
      </g>
    </g>

    <g transform="translate(486 120)">
      <rect x="12" y="12" width="66" height="106" rx="6" fill="#0a1f28" stroke="#22d3ee" stroke-opacity=".3" stroke-width="1.8"/>
      <rect x="6" y="6" width="66" height="106" rx="6" fill="#0a1f28" stroke="#22d3ee" stroke-opacity=".45" stroke-width="1.8"/>
      <rect x="0" y="0" width="66" height="106" rx="6" fill="#0b2630" stroke="#22d3ee" stroke-opacity=".75" stroke-width="2"/>
      <g fill="#5eead4">
        <rect x="12" y="16" width="42" height="8" rx="4" fill-opacity=".7"/>
        <rect x="12" y="34" width="28" height="8" rx="4" fill-opacity=".45"/>
        <rect x="12" y="52" width="36" height="8" rx="4" fill-opacity=".6"/>
        <rect x="12" y="70" width="22" height="8" rx="4" fill-opacity=".35"/>
      </g>
    </g>
  </g>

  <!-- dense head -->
  <g transform="translate(600 118)">
    <g fill="none" stroke="#22d3ee" stroke-opacity=".35" stroke-width="1.5">
      <path d="M0 22h52M0 22L52 62M0 62h52M0 62L52 22M0 62L52 102M0 102h52M0 102L52 62"/>
    </g>
    <g fill="#0b2630" stroke="#5eead4" stroke-width="2">
      <circle cx="0" cy="22" r="9"/><circle cx="0" cy="62" r="9"/><circle cx="0" cy="102" r="9"/>
      <circle cx="52" cy="22" r="9"/><circle cx="52" cy="62" r="9"/><circle cx="52" cy="102" r="9"/>
    </g>
  </g>

  <!-- output -->
  <g transform="translate(688 150)">
    <rect width="70" height="60" rx="12" fill="#0a1f28" stroke="#5eead4" stroke-opacity=".75" stroke-width="2"/>
    <path d="M22 30l9 11 18-22" fill="none" stroke="#5eead4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
